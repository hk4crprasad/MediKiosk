# ==============================================================================
# MediKiosk API - Nginx Reverse Proxy Configuration
# Domain: api-sih.cynerza.in -> http://127.0.0.1:8000
# ==============================================================================

# Upstream definition for backend FastAPI service
upstream medikiosk_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server (Port 80)
# Automatically redirects to HTTPS once SSL certificates are installed via Certbot
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api-sih.cynerza.in;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Location block for HTTP traffic (proxy or redirect)
    location / {
        # Proxy settings
        proxy_pass http://medikiosk_api;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # File upload limits (e.g. for medical records / PDF OCR scans)
        client_max_body_size 25M;
        client_body_buffer_size 128k;

        # Extended timeouts for AI summary generation and audio transcription
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Buffering
        proxy_buffering off;
    }
}

